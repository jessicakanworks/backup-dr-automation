groups:
  - name: backup
    rules:
      - alert: BackupMissing
        expr: time() - restic_last_success_timestamp > 26 * 3600
        for: 30m
        labels: {severity: critical}
        annotations: {summary: "No successful backup on {{ $labels.instance }} in 26h"}
      - alert: DRReplicationLag
        expr: time() - dr_replication_last_success_timestamp > 6 * 3600
        for: 15m
        labels: {severity: critical}
        annotations: {summary: "DR replication has not succeeded for over 6 hours"}
      - alert: BackupMetricAbsent
        expr: absent(restic_last_success_timestamp)
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "Backup metric missing — agent not reporting"}
